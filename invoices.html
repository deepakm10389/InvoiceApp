<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All Bills · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
      <div>
        <h1 class="page-title">All Bills</h1>
        <p class="page-sub mb-0">Filter, edit, and regenerate quotation / tax invoice reports.</p>
      </div>
      <a class="btn btn-brand" href="create-invoice.html">+ New</a>
    </div>

    <div class="card-panel">
      <div class="filter-bar">
        <div>
          <label class="form-label" for="searchBox">Search</label>
          <input class="form-control" id="searchBox" placeholder="Bill no, client, type…" />
        </div>
        <div>
          <label class="form-label" for="filterType">Doc type</label>
          <select class="form-select" id="filterType">
            <option value="">All</option>
            <option value="quotation">Quotation</option>
            <option value="tax_invoice">Tax Invoice</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filterFrom">From date</label>
          <input class="form-control" type="date" id="filterFrom" />
        </div>
        <div>
          <label class="form-label" for="filterTo">To date</label>
          <input class="form-control" type="date" id="filterTo" />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="filterClient">Client</label>
        <select class="form-select" id="filterClient">
          <option value="">All clients</option>
        </select>
      </div>
      <div class="filter-meta" id="filterMeta"></div>

      <div class="table-wrap desktop-table">
        <table class="table table-hover align-middle mb-0">
          <thead id="sortHeaders">
            <tr>
              <th data-sort="bill_number">BillNo</th>
              <th data-sort="doc_type">Type</th>
              <th data-sort="biller_name">Biller</th>
              <th data-sort="client_name">Client</th>
              <th data-sort="invoice_date">Date</th>
              <th data-sort="sub_total">SubTotal</th>
              <th data-sort="cgst">CGST</th>
              <th data-sort="sgst">SGST</th>
              <th data-sort="igst">IGST</th>
              <th data-sort="total">Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="gridCards"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    $(async function () {
      var session = await window.UI.bootPage("invoices.html");
      if (!session) return;
      var H = window.DB.helpers;

      var clients = await window.DB.listClients();
      $("#filterClient").append(
        clients.map(function (c) {
          return '<option value="' + c.id + '">' + window.UI.escapeHtml(c.client_name) + "</option>";
        }).join("")
      );

      function typeLabel(t) {
        return t === "quotation" ? "Quotation" : "Tax Invoice";
      }

      function render(rows) {
        if (!rows.length) {
          $("#gridBody").html('<tr><td colspan="11" class="text-muted">No bills match your filters.</td></tr>');
          $("#gridCards").html('<div class="text-muted">No bills match your filters.</div>');
          return;
        }
        $("#gridBody").html(rows.map(function (r) {
          return '<tr><td>' + (r.bill_number || 0) + '</td><td>' + typeLabel(r.doc_type) +
            '</td><td>' + window.UI.escapeHtml(r.biller_name || "") +
            '</td><td>' + window.UI.escapeHtml(r.client_name || "") +
            '</td><td>' + H.formatDate(r.invoice_date) +
            '</td><td class="text-end">' + H.formatMoney(r.sub_total) +
            '</td><td class="text-end">' + H.formatMoney(r.cgst) +
            '</td><td class="text-end">' + H.formatMoney(r.sgst) +
            '</td><td class="text-end">' + H.formatMoney(r.igst) +
            '</td><td class="text-end fw-semibold">' + H.formatMoney(r.total) +
            '</td><td class="text-nowrap">' +
            '<a class="btn btn-sm btn-outline-brand" href="invoice-print.html?id=' + encodeURIComponent(r.id) + '">Report</a> ' +
            '<a class="btn btn-sm btn-brand" href="create-invoice.html?id=' + encodeURIComponent(r.id) + '">Edit</a> ' +
            '<button class="btn btn-sm btn-outline-danger btn-del" data-id="' + r.id + '">Delete</button></td></tr>';
        }).join(""));
        $("#gridCards").html(rows.map(function (r) {
          return '<div class="data-card"><div class="title">' + window.UI.escapeHtml(r.client_name || "") +
            '</div><div class="meta">' + typeLabel(r.doc_type) + ' · Bill #' + (r.bill_number || 0) +
            ' · ' + H.formatDate(r.invoice_date) +
            '</div><div class="meta">Total ₹' + H.formatMoney(r.total) +
            ' (CGST ' + H.formatMoney(r.cgst) + ' / SGST ' + H.formatMoney(r.sgst) + ' / IGST ' + H.formatMoney(r.igst) +
            ')</div><div class="actions">' +
            '<a class="btn btn-sm btn-outline-brand" href="invoice-print.html?id=' + encodeURIComponent(r.id) + '">Report</a>' +
            '<a class="btn btn-sm btn-brand" href="create-invoice.html?id=' + encodeURIComponent(r.id) + '">Edit</a>' +
            '<button class="btn btn-sm btn-outline-danger btn-del" data-id="' + r.id + '">Delete</button></div></div>';
        }).join(""));
      }

      var grid = window.UI.createGridController({
        rows: [],
        sortKey: "invoice_date",
        sortDir: "desc",
        metaSelector: "#filterMeta",
        filterFns: {
          doc_type: function (row, val) { return row.doc_type === val; },
          client_id: function (row, val) { return row.client_id === val; },
          from: function (row, val) { return String(row.invoice_date).slice(0, 10) >= val; },
          to: function (row, val) { return String(row.invoice_date).slice(0, 10) <= val; }
        },
        render: render
      });

      window.UI.bindFilterBar(grid, {
        search: "#searchBox",
        sortHeaders: "#sortHeaders",
        filters: {
          doc_type: "#filterType",
          client_id: "#filterClient",
          from: "#filterFrom",
          to: "#filterTo"
        }
      });

      $(document).on("click", ".btn-del", async function () {
        if (!window.UI.confirm("Delete this bill? This cannot be undone.")) return;
        try {
          await window.DB.deleteInvoice($(this).data("id"));
          window.UI.toast("Bill deleted", "success");
          await reload();
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      async function reload() {
        grid.setRows(await window.DB.listInvoices());
      }
      await reload();
    });
  </script>
</body>
</html>
