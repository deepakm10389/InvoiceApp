<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Import masters · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <h1 class="page-title">Import clients &amp; items</h1>
    <p class="page-sub">
      Load master data extracted from the old .NET app
      (<code>scripts/seed-data/clients.json</code> &amp; <code>items.json</code>).
      Existing records with the same name are skipped.
    </p>

    <div class="card-panel">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="stat-card">
            <div class="label">Clients in seed file</div>
            <div class="value" id="clientCount">—</div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="stat-card">
            <div class="label">Items in seed file</div>
            <div class="value" id="itemCount">—</div>
          </div>
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button type="button" class="btn btn-brand" id="btnImport">Import into my account</button>
        <a class="btn btn-outline-brand" href="clients.html">Open clients</a>
        <a class="btn btn-outline-brand" href="items.html">Open items</a>
        <a class="btn btn-outline-secondary" href="dashboard.html">Dashboard</a>
      </div>
      <pre id="log" class="mt-3 p-3 bg-light border rounded small" style="min-height:160px;white-space:pre-wrap;"></pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    function log(msg) {
      $("#log").append(window.UI.escapeHtml(msg) + "\n");
    }

    $(async function () {
      var session = await window.UI.bootPage("import-masters.html");
      if (!session) return;

      var clients = [];
      var items = [];
      try {
        clients = await $.getJSON("scripts/seed-data/clients.json");
        items = await $.getJSON("scripts/seed-data/items.json");
        $("#clientCount").text(clients.length);
        $("#itemCount").text(items.length);
        log("Loaded seed files.");
        log("Clients: " + clients.length);
        log("Items: " + items.length);
        log("Mode: " + (window.APP_CONFIG.useSupabase() ? "Supabase cloud" : "Demo localStorage"));
      } catch (err) {
        log("Failed to load seed JSON: " + (err.message || err));
      }

      $("#btnImport").on("click", async function () {
        if (!clients.length && !items.length) {
          window.UI.toast("No seed data loaded", "error");
          return;
        }
        if (!window.UI.confirm("Import masters into the signed-in account? Duplicates by name will be skipped.")) {
          return;
        }
        $("#btnImport").prop("disabled", true);
        try {
          var existingClients = await window.DB.listClients();
          var existingItems = await window.DB.listItems();
          var clientNames = {};
          existingClients.forEach(function (c) {
            clientNames[String(c.client_name || "").trim().toLowerCase()] = c;
          });
          var itemNames = {};
          existingItems.forEach(function (i) {
            itemNames[String(i.item_name || "").trim().toLowerCase()] = true;
          });

          var cAdded = 0,
            cSkip = 0,
            aAdded = 0,
            iAdded = 0,
            iSkip = 0;

          for (var ci = 0; ci < clients.length; ci++) {
            var src = clients[ci];
            var key = String(src.client_name || "").trim().toLowerCase();
            var clientRow = clientNames[key];
            if (!clientRow) {
              clientRow = await window.DB.saveClient({
                client_name: src.client_name,
                phone_no: src.phone_no || "",
                mobile_no: src.mobile_no || "",
                gst_no: src.gst_no || "",
                pan_no: src.pan_no || "",
                state_code: src.state_code || "",
                email_id: src.email_id || "",
                address: ""
              });
              clientNames[key] = clientRow;
              cAdded++;
            } else {
              cSkip++;
            }

            var existingAddrs = await window.DB.listAddresses(clientRow.id);
            var addrSet = {};
            existingAddrs.forEach(function (a) {
              addrSet[String(a.address || "").trim().toLowerCase()] = true;
            });
            (src.addresses || []).forEach(async function () {});
            for (var ai = 0; ai < (src.addresses || []).length; ai++) {
              var addr = src.addresses[ai];
              var akey = String(addr.address || "").trim().toLowerCase();
              if (!akey || addrSet[akey]) continue;
              await window.DB.saveAddress({
                client_id: clientRow.id,
                label: addr.label || "Address " + (existingAddrs.length + ai + 1),
                address: addr.address,
                state_code: addr.state_code || src.state_code || ""
              });
              addrSet[akey] = true;
              aAdded++;
            }

            if ((ci + 1) % 25 === 0) log("Clients processed: " + (ci + 1) + "/" + clients.length);
          }

          for (var ii = 0; ii < items.length; ii++) {
            var it = items[ii];
            var ikey = String(it.item_name || "").trim().toLowerCase();
            if (itemNames[ikey]) {
              iSkip++;
              continue;
            }
            await window.DB.saveItem({
              item_name: it.item_name,
              rate: Number(it.rate) || 0,
              description: it.description || it.item_name
            });
            itemNames[ikey] = true;
            iAdded++;
          }

          log("---- Done ----");
          log("Clients added: " + cAdded + " (skipped existing: " + cSkip + ")");
          log("Addresses added: " + aAdded);
          log("Items added: " + iAdded + " (skipped existing: " + iSkip + ")");
          window.UI.toast("Import finished", "success");
        } catch (err) {
          log("ERROR: " + (err.message || err));
          window.UI.toast(err.message || "Import failed", "error");
        } finally {
          $("#btnImport").prop("disabled", false);
        }
      });
    });
  </script>
</body>
</html>
