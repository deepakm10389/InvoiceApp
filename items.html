<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Items · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
      <div>
        <h1 class="page-title">Items</h1>
        <p class="page-sub mb-0">Master list of services and rates.</p>
      </div>
      <button class="btn btn-brand" type="button" id="btnAdd">+ Add item</button>
    </div>

    <div class="card-panel">
      <div class="filter-bar items">
        <div>
          <label class="form-label" for="searchBox">Search</label>
          <input class="form-control" id="searchBox" placeholder="Item name or description…" />
        </div>
      </div>
      <div class="filter-meta" id="filterMeta"></div>

      <div class="table-wrap desktop-table">
        <table class="table table-hover align-middle mb-0">
          <thead id="sortHeaders">
            <tr>
              <th data-sort="item_name">Item</th>
              <th data-sort="rate">Rate</th>
              <th data-sort="description">Description</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="gridCards"></div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="editForm">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="itemId" />
          <div class="mb-3">
            <label class="form-label">Item name *</label>
            <input class="form-control" id="item_name" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Rate *</label>
            <input class="form-control" type="number" inputmode="decimal" step="0.01" min="0" id="rate" required />
          </div>
          <div class="mb-0">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    $(async function () {
      var session = await window.UI.bootPage("items.html");
      if (!session) return;
      var modal = new bootstrap.Modal("#editModal");
      var H = window.DB.helpers;

      function render(rows) {
        if (!rows.length) {
          $("#gridBody").html('<tr><td colspan="4" class="text-muted">No items match your filters.</td></tr>');
          $("#gridCards").html('<div class="text-muted">No items match your filters.</div>');
          return;
        }
        $("#gridBody").html(rows.map(function (i) {
          return '<tr><td><strong>' + window.UI.escapeHtml(i.item_name) + '</strong></td><td>₹' +
            H.formatMoney(i.rate) + '</td><td>' + window.UI.escapeHtml(i.description || "—") +
            '</td><td class="text-nowrap"><button class="btn btn-sm btn-outline-brand btn-edit" data-id="' + i.id +
            '">Edit</button> <button class="btn btn-sm btn-outline-danger btn-del" data-id="' + i.id +
            '">Delete</button></td></tr>';
        }).join(""));
        $("#gridCards").html(rows.map(function (i) {
          return '<div class="data-card"><div class="title">' + window.UI.escapeHtml(i.item_name) +
            '</div><div class="meta">Rate: ₹' + H.formatMoney(i.rate) +
            '</div><div class="meta">' + window.UI.escapeHtml(i.description || "") +
            '</div><div class="actions"><button class="btn btn-sm btn-outline-brand btn-edit" data-id="' + i.id +
            '">Edit</button><button class="btn btn-sm btn-outline-danger btn-del" data-id="' + i.id +
            '">Delete</button></div></div>';
        }).join(""));
      }

      var grid = window.UI.createGridController({
        rows: [],
        sortKey: "item_name",
        metaSelector: "#filterMeta",
        render: render
      });
      window.UI.bindFilterBar(grid, { search: "#searchBox", sortHeaders: "#sortHeaders" });

      async function reload() {
        var rows = await window.DB.listItems();
        grid.setRows(rows);
        window._itemsCache = rows;
      }

      $("#btnAdd").on("click", function () {
        $("#modalTitle").text("Add item");
        $("#editForm")[0].reset();
        $("#itemId").val("");
        modal.show();
      });

      $(document).on("click", ".btn-edit", function () {
        var id = $(this).data("id");
        var i = (window._itemsCache || []).find(function (x) { return x.id === id; });
        if (!i) return;
        $("#modalTitle").text("Edit item");
        $("#itemId").val(i.id);
        $("#item_name").val(i.item_name);
        $("#rate").val(i.rate);
        $("#description").val(i.description || "");
        modal.show();
      });

      $(document).on("click", ".btn-del", async function () {
        if (!window.UI.confirm("Delete this item?")) return;
        try {
          await window.DB.deleteItem($(this).data("id"));
          window.UI.toast("Item deleted", "success");
          await reload();
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      $("#editForm").on("submit", async function (e) {
        e.preventDefault();
        try {
          await window.DB.saveItem({
            id: $("#itemId").val() || undefined,
            item_name: $("#item_name").val().trim(),
            rate: Number($("#rate").val()),
            description: $("#description").val().trim()
          });
          modal.hide();
          window.UI.toast("Item saved", "success");
          await reload();
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      await reload();
    });
  </script>
</body>
</html>
