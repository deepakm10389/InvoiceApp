<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <div class="no-print d-flex flex-wrap gap-2 mb-3">
      <a class="btn btn-outline-secondary" href="invoices.html">← Back</a>
      <a class="btn btn-outline-brand" id="btnEdit" href="#">Edit bill</a>
      <button type="button" class="btn btn-brand" id="btnPrint">Print</button>
      <button type="button" class="btn btn-outline-brand" id="btnPdf">Download PDF</button>
    </div>
    <div id="reportHost"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    function nl2br(text) {
      return window.UI.escapeHtml(text || "").replace(/\n/g, "<br>");
    }

    function renderReport(data) {
      var H = window.DB.helpers;
      var inv = data.invoice;
      var client = data.client || {};
      var profile = data.profile || {};
      var items = data.items || [];
      var title = inv.doc_type === "quotation" ? "QUOTATION" : "TAX INVOICE";
      var numberLabel = inv.doc_type === "quotation" ? "Quotation No" : "BillNo";
      var proprietor = profile.proprietor_name || profile.biller_name || "";
      var toAddress = (data.address && data.address.address) || client.address || "";

      var rows = items
        .map(function (li, idx) {
          var bg = idx % 2 === 1 ? "background-color:#f7fbff;" : "background-color:#ffffff;";
          return (
            '<tr style="' +
            bg +
            '"><td style="border:1px solid #555;padding:0.35rem 0.4rem;">' +
            (idx + 1) +
            '</td><td style="border:1px solid #555;padding:0.35rem 0.4rem;">' +
            nl2br(li.item_name) +
            '</td><td style="border:1px solid #555;padding:0.35rem 0.4rem;">' +
            window.UI.escapeHtml(li.type_name || "") +
            '</td><td class="num" style="border:1px solid #555;padding:0.35rem 0.4rem;text-align:right;">' +
            H.formatMoney(li.quantity) +
            '</td><td class="num" style="border:1px solid #555;padding:0.35rem 0.4rem;text-align:right;">' +
            H.formatMoney(li.rate) +
            '</td><td class="num" style="border:1px solid #555;padding:0.35rem 0.4rem;text-align:right;">' +
            H.formatMoney(li.line_total) +
            "</td></tr>"
          );
        })
        .join("");

      return (
        '<div class="invoice-sheet" id="invoiceSheet" style="-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;font-family:Calibri, Candara, Segoe UI, Optima, Arial, sans-serif;">' +
        '<div class="letterhead"><h1 style="color:#e00000;margin:0;font-size:1.55rem;text-transform:uppercase;font-weight:700;">' +
        window.UI.escapeHtml(profile.biller_name || "") +
        '</h1><div class="tagline" style="color:#e00000;font-size:0.82rem;margin-top:0.2rem;font-weight:600;text-transform:uppercase;">' +
        window.UI.escapeHtml(profile.tagline || "") +
        "</div></div>" +
        '<div class="doc-title">' +
        title +
        "</div>" +
        '<div class="top-meta"><div><strong>Date :</strong> ' +
        H.formatDate(inv.invoice_date) +
        "</div><div><strong>" +
        numberLabel +
        " :</strong> " +
        (inv.bill_number || 0) +
        "</div></div>" +
        '<div class="section-label" style="display:inline-block;background-color:#2f6db5;color:#ffffff;font-weight:700;font-size:0.9rem;padding:0.2rem 0.85rem;margin:0.65rem 0 0.35rem;">Address</div>' +
        '<div class="addr-block">' +
        nl2br(profile.address || "") +
        "<br>GSTIN:" +
        window.UI.escapeHtml(profile.gst_no || "") +
        "<br>Mob:" +
        window.UI.escapeHtml(profile.phone || "") +
        "<br>Email:" +
        window.UI.escapeHtml(profile.email || "") +
        "<br>PAN:" +
        window.UI.escapeHtml(profile.pan_no || "") +
        "</div>" +
        '<div class="section-label" style="display:inline-block;background-color:#2f6db5;color:#ffffff;font-weight:700;font-size:0.9rem;padding:0.2rem 0.85rem;margin:0.65rem 0 0.35rem;">TO</div>' +
        '<div class="addr-block"><div class="party-name">' +
        window.UI.escapeHtml(client.client_name || "") +
        "</div>" +
        nl2br(toAddress) +
        "<br>GSTIN:" +
        window.UI.escapeHtml(client.gst_no || "") +
        "<br>PAN:" +
        window.UI.escapeHtml(client.pan_no || "") +
        "</div>" +
        '<table class="items-table"><thead><tr>' +
        '<th style="background-color:#dbe8f6;color:#112233;border:1px solid #555;padding:0.35rem 0.4rem;">No</th>' +
        '<th style="background-color:#dbe8f6;color:#112233;border:1px solid #555;padding:0.35rem 0.4rem;">Item Name</th>' +
        '<th style="background-color:#dbe8f6;color:#112233;border:1px solid #555;padding:0.35rem 0.4rem;">Type Name</th>' +
        '<th style="background-color:#dbe8f6;color:#112233;border:1px solid #555;padding:0.35rem 0.4rem;">Quantity</th>' +
        '<th style="background-color:#dbe8f6;color:#112233;border:1px solid #555;padding:0.35rem 0.4rem;">Rate</th>' +
        '<th style="background-color:#dbe8f6;color:#112233;border:1px solid #555;padding:0.35rem 0.4rem;">Total</th>' +
        "</tr></thead><tbody>" +
        rows +
        "</tbody></table>" +
        '<div class="totals">' +
        "<div><span>SubTotal</span><span>: " +
        H.formatMoney(inv.sub_total) +
        "</span></div>" +
        "<div><span>CGST " +
        Number(inv.cgst_pct || 0).toFixed(2) +
        " %</span><span>: " +
        H.formatMoney(inv.cgst) +
        "</span></div>" +
        "<div><span>SGST " +
        Number(inv.sgst_pct || 0).toFixed(2) +
        " %</span><span>: " +
        H.formatMoney(inv.sgst) +
        "</span></div>" +
        "<div><span>IGST " +
        Number(inv.igst_pct || 0).toFixed(2) +
        " %</span><span>: " +
        H.formatMoney(inv.igst) +
        "</span></div>" +
        '<div class="grand" style="font-weight:700;color:#e00000;border-bottom:2px solid #e00000;"><span>TOTAL</span><span>: ' +
        H.formatMoney(inv.total) +
        "</span></div></div>" +
        '<div class="sac-line">SAC code - ' +
        window.UI.escapeHtml(inv.sac_code || "") +
        "</div>" +
        '<div class="footer-note">Note: Certified that the particulars given above are true and correct</div>' +
        '<div class="footer-keep-together">' +
        '<div class="bank-box"><div class="section-label" style="display:inline-block;background-color:#2f6db5;color:#ffffff;font-weight:700;font-size:0.9rem;padding:0.2rem 0.85rem;margin:0.65rem 0 0.35rem;">BANK DETAILS</div><div class="bank-body">' +
        "Bank Name : " +
        window.UI.escapeHtml(profile.bank_name || "") +
        "<br>Account no : " +
        window.UI.escapeHtml(profile.account_no || "") +
        "<br>IFSC Code : " +
        window.UI.escapeHtml(profile.ifsc_code || "") +
        "<br>Branch : " +
        window.UI.escapeHtml(profile.branch || "") +
        '</div></div>' +
        '<div class="sign">For ' +
        window.UI.escapeHtml(proprietor) +
        '<div class="sign-line">Proprietor</div></div>' +
        "</div></div>"
      );
    }

    $(async function () {
      var session = await window.UI.bootPage("invoices.html");
      if (!session) return;
      var id = new URLSearchParams(window.location.search).get("id");
      if (!id) {
        $("#reportHost").html('<div class="alert alert-warning">Missing bill id.</div>');
        return;
      }
      $("#btnEdit").attr("href", "create-invoice.html?id=" + encodeURIComponent(id));
      var data = await window.DB.getInvoice(id);
      if (!data) {
        $("#reportHost").html('<div class="alert alert-danger">Bill not found.</div>');
        return;
      }
      $("#reportHost").html(renderReport(data));

      $("#btnPrint").on("click", function () {
        window.print();
      });

      $("#btnPdf").on("click", function () {
        var el = document.getElementById("invoiceSheet");
        var name =
          (data.invoice.doc_type === "quotation" ? "Quotation" : "TaxInvoice") +
          "_" +
          (data.invoice.bill_number || 0) +
          ".pdf";
        // Force color rendering in the cloned DOM used by html2canvas
        html2pdf()
          .set({
            margin: [8, 8, 8, 8],
            filename: name,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: {
              scale: 2,
              useCORS: true,
              backgroundColor: "#ffffff",
              logging: false,
              onclone: function (clonedDoc) {
                var sheet = clonedDoc.getElementById("invoiceSheet");
                if (!sheet) return;
                sheet.style.fontFamily = "Calibri, Candara, Segoe UI, Optima, Arial, sans-serif";
                sheet.style.webkitPrintColorAdjust = "exact";
                sheet.style.printColorAdjust = "exact";
                sheet.querySelectorAll(".section-label").forEach(function (node) {
                  node.style.backgroundColor = "#2f6db5";
                  node.style.color = "#ffffff";
                });
                sheet.querySelectorAll("th").forEach(function (node) {
                  node.style.backgroundColor = "#dbe8f6";
                  node.style.color = "#112233";
                });
                sheet.querySelectorAll(".letterhead h1, .letterhead .tagline, .grand").forEach(function (node) {
                  node.style.color = "#e00000";
                });
                sheet.querySelectorAll("*").forEach(function (node) {
                  node.style.fontFamily = "Calibri, Candara, Segoe UI, Optima, Arial, sans-serif";
                });
              }
            },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
            pagebreak: { mode: ["css", "legacy"], avoid: [".footer-keep-together", ".bank-box", "tr"] }
          })
          .from(el)
          .save();
      });
    });
  </script>
</body>
</html>
