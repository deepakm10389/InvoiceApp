<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clients · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
      <div>
        <h1 class="page-title">Clients</h1>
        <p class="page-sub mb-0">One client can have multiple site addresses for quotations.</p>
      </div>
      <button class="btn btn-brand" type="button" id="btnAdd">+ Add client</button>
    </div>

    <div class="card-panel">
      <div class="filter-bar clients">
        <div>
          <label class="form-label" for="searchBox">Search</label>
          <input class="form-control" id="searchBox" placeholder="Name, GST, phone, email, address…" />
        </div>
      </div>
      <div class="filter-meta" id="filterMeta"></div>

      <div class="table-wrap desktop-table">
        <table class="table table-hover align-middle mb-0">
          <thead id="sortHeaders">
            <tr>
              <th>#</th>
              <th data-sort="client_name">Client</th>
              <th data-sort="address_count">Addresses</th>
              <th data-sort="gst_no">GSTIN</th>
              <th data-sort="mobile_no">Mobile</th>
              <th data-sort="state_code">State</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="gridCards"></div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <form class="modal-content" id="editForm">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add client</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="clientId" />
          <div class="mb-3">
            <label class="form-label">Client name *</label>
            <input class="form-control" id="client_name" required />
          </div>
          <div class="row g-2">
            <div class="col-6 mb-3">
              <label class="form-label">Phone</label>
              <input class="form-control" type="tel" id="phone_no" />
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Mobile</label>
              <input class="form-control" type="tel" id="mobile_no" />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">GSTIN</label>
            <input class="form-control" id="gst_no" />
          </div>
          <div class="row g-2">
            <div class="col-6 mb-3">
              <label class="form-label">PAN</label>
              <input class="form-control" id="pan_no" />
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">State code</label>
              <input class="form-control" id="state_code" placeholder="e.g. 27" />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" id="email_id" />
          </div>
          <div class="mb-0" id="firstAddressWrap">
            <label class="form-label">First address (optional)</label>
            <textarea class="form-control" id="first_address" rows="2" placeholder="You can add more addresses after saving"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-brand">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="addrModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Addresses — <span id="addrClientName"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="addrClientId" />
          <form id="addrForm" class="card-panel mb-3">
            <input type="hidden" id="addrId" />
            <div class="row g-2">
              <div class="col-md-4">
                <label class="form-label">Label</label>
                <input class="form-control" id="addr_label" placeholder="Address 1 / Site A" />
              </div>
              <div class="col-md-3">
                <label class="form-label">State code</label>
                <input class="form-control" id="addr_state" placeholder="27" />
              </div>
              <div class="col-md-5 d-flex align-items-end">
                <button type="submit" class="btn btn-brand w-100" id="addrSaveBtn">Add address</button>
              </div>
              <div class="col-12">
                <label class="form-label">Address *</label>
                <textarea class="form-control" id="addr_text" rows="3" required></textarea>
              </div>
            </div>
          </form>
          <div id="addrList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    $(async function () {
      var session = await window.UI.bootPage("clients.html");
      if (!session) return;
      var modal = new bootstrap.Modal("#editModal");
      var addrModal = new bootstrap.Modal("#addrModal");

      function render(rows) {
        if (!rows.length) {
          $("#gridBody").html('<tr><td colspan="7" class="text-muted">No clients match your filters.</td></tr>');
          $("#gridCards").html('<div class="text-muted">No clients match your filters.</div>');
          return;
        }
        $("#gridBody").html(rows.map(function (c, idx) {
          return '<tr><td>' + (idx + 1) + '</td><td><strong>' + window.UI.escapeHtml(c.client_name) +
            '</strong></td><td>' + (c.address_count || 0) +
            '</td><td>' + window.UI.escapeHtml(c.gst_no || "—") +
            '</td><td>' + window.UI.escapeHtml(c.mobile_no || c.phone_no || "—") +
            '</td><td>' + window.UI.escapeHtml(c.state_code || "—") +
            '</td><td class="text-nowrap">' +
            '<button class="btn btn-sm btn-outline-brand btn-addrs" data-id="' + c.id + '">Addresses</button> ' +
            '<button class="btn btn-sm btn-outline-brand btn-edit" data-id="' + c.id + '">Edit</button> ' +
            '<button class="btn btn-sm btn-outline-danger btn-del" data-id="' + c.id + '">Delete</button></td></tr>';
        }).join(""));
        $("#gridCards").html(rows.map(function (c, idx) {
          return '<div class="data-card"><div class="title">#' + (idx + 1) + ' · ' + window.UI.escapeHtml(c.client_name) +
            '</div><div class="meta">Addresses: ' + (c.address_count || 0) +
            '</div><div class="meta">GST: ' + window.UI.escapeHtml(c.gst_no || "—") +
            '</div><div class="actions">' +
            '<button class="btn btn-sm btn-outline-brand btn-addrs" data-id="' + c.id + '">Addresses</button>' +
            '<button class="btn btn-sm btn-outline-brand btn-edit" data-id="' + c.id + '">Edit</button>' +
            '<button class="btn btn-sm btn-outline-danger btn-del" data-id="' + c.id + '">Delete</button></div></div>';
        }).join(""));
      }

      var grid = window.UI.createGridController({
        rows: [],
        sortKey: "client_name",
        metaSelector: "#filterMeta",
        render: render
      });
      window.UI.bindFilterBar(grid, { search: "#searchBox", sortHeaders: "#sortHeaders" });

      async function reload() {
        var rows = await window.DB.listClients();
        grid.setRows(rows);
        window._clientsCache = rows;
      }

      async function renderAddrList(clientId) {
        var list = await window.DB.listAddresses(clientId);
        if (!list.length) {
          $("#addrList").html('<div class="text-muted">No addresses yet. Add the first site address above.</div>');
          return;
        }
        $("#addrList").html(list.map(function (a, idx) {
          return '<div class="data-card mb-2"><div class="title">#' + (idx + 1) + ' · ' +
            window.UI.escapeHtml(a.label || "Address") +
            '</div><div class="meta">' + window.UI.escapeHtml(a.address || "") +
            '</div><div class="meta">State: ' + window.UI.escapeHtml(a.state_code || "—") +
            '</div><div class="actions">' +
            '<button type="button" class="btn btn-sm btn-outline-brand btn-addr-edit" data-id="' + a.id + '">Edit</button>' +
            '<button type="button" class="btn btn-sm btn-outline-danger btn-addr-del" data-id="' + a.id + '">Delete</button></div></div>';
        }).join(""));
        window._addrCache = list;
      }

      $("#btnAdd").on("click", function () {
        $("#modalTitle").text("Add client");
        $("#editForm")[0].reset();
        $("#clientId").val("");
        $("#firstAddressWrap").show();
        modal.show();
      });

      $(document).on("click", ".btn-edit", function () {
        var id = $(this).data("id");
        var c = (window._clientsCache || []).find(function (x) { return x.id === id; });
        if (!c) return;
        $("#modalTitle").text("Edit client");
        $("#clientId").val(c.id);
        $("#client_name").val(c.client_name);
        $("#phone_no").val(c.phone_no || "");
        $("#mobile_no").val(c.mobile_no || "");
        $("#gst_no").val(c.gst_no || "");
        $("#pan_no").val(c.pan_no || "");
        $("#state_code").val(c.state_code || "");
        $("#email_id").val(c.email_id || "");
        $("#first_address").val("");
        $("#firstAddressWrap").hide();
        modal.show();
      });

      $(document).on("click", ".btn-addrs", async function () {
        var id = $(this).data("id");
        var c = (window._clientsCache || []).find(function (x) { return x.id === id; });
        if (!c) return;
        $("#addrClientId").val(c.id);
        $("#addrClientName").text(c.client_name);
        $("#addrForm")[0].reset();
        $("#addrId").val("");
        $("#addr_state").val(c.state_code || "");
        $("#addrSaveBtn").text("Add address");
        await renderAddrList(c.id);
        addrModal.show();
      });

      $(document).on("click", ".btn-addr-edit", function () {
        var id = $(this).data("id");
        var a = (window._addrCache || []).find(function (x) { return x.id === id; });
        if (!a) return;
        $("#addrId").val(a.id);
        $("#addr_label").val(a.label || "");
        $("#addr_state").val(a.state_code || "");
        $("#addr_text").val(a.address || "");
        $("#addrSaveBtn").text("Update address");
      });

      $(document).on("click", ".btn-addr-del", async function () {
        if (!window.UI.confirm("Delete this address?")) return;
        try {
          await window.DB.deleteAddress($(this).data("id"));
          window.UI.toast("Address deleted", "success");
          await renderAddrList($("#addrClientId").val());
          await reload();
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      $("#addrForm").on("submit", async function (e) {
        e.preventDefault();
        try {
          await window.DB.saveAddress({
            id: $("#addrId").val() || undefined,
            client_id: $("#addrClientId").val(),
            label: $("#addr_label").val().trim(),
            state_code: $("#addr_state").val().trim(),
            address: $("#addr_text").val().trim()
          });
          $("#addrForm")[0].reset();
          $("#addrId").val("");
          $("#addrSaveBtn").text("Add address");
          window.UI.toast("Address saved", "success");
          await renderAddrList($("#addrClientId").val());
          await reload();
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      $(document).on("click", ".btn-del", async function () {
        if (!window.UI.confirm("Delete this client and all its addresses?")) return;
        try {
          await window.DB.deleteClient($(this).data("id"));
          window.UI.toast("Client deleted", "success");
          await reload();
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      $("#editForm").on("submit", async function (e) {
        e.preventDefault();
        try {
          var saved = await window.DB.saveClient({
            id: $("#clientId").val() || undefined,
            client_name: $("#client_name").val().trim(),
            phone_no: $("#phone_no").val().trim(),
            mobile_no: $("#mobile_no").val().trim(),
            gst_no: $("#gst_no").val().trim(),
            pan_no: $("#pan_no").val().trim(),
            state_code: $("#state_code").val().trim(),
            email_id: $("#email_id").val().trim(),
            address: $("#first_address").val().trim()
          });
          modal.hide();
          window.UI.toast("Client saved", "success");
          await reload();
          if (!$("#clientId").val() && $("#first_address").val().trim() === "" && saved) {
            // prompt to add addresses
          }
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      await reload();
    });
  </script>
</body>
</html>
