<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-sub">Overview of your quotations and tax invoices.</p>
    <div class="stat-grid mb-3" id="stats"></div>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <a class="btn btn-brand" href="create-invoice.html">+ New quotation / invoice</a>
      <a class="btn btn-outline-brand" href="invoices.html">View all bills</a>
    </div>
    <div class="card-panel">
      <h2 class="h5 mb-3">Recent bills</h2>
      <div class="table-wrap desktop-table">
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>#</th><th>Bill No</th><th>Type</th><th>Client</th><th>Date</th><th class="text-end">Total</th><th></th></tr></thead>
          <tbody id="recentTable"></tbody>
        </table>
      </div>
      <div class="mobile-cards" id="recentCards"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    $(async function () {
      var session = await window.UI.bootPage("dashboard.html");
      if (!session) return;
      var H = window.DB.helpers;
      var data = await window.DB.getDashboard();
      $("#stats").html(
        '<div class="stat-card"><div class="label">Bills</div><div class="value">' + data.invoiceCount + '</div></div>' +
        '<div class="stat-card"><div class="label">Revenue</div><div class="value">₹' + H.formatMoney(data.revenue) + '</div></div>' +
        '<div class="stat-card"><div class="label">Clients</div><div class="value">' + data.clientCount + '</div></div>' +
        '<div class="stat-card"><div class="label">Items</div><div class="value">' + data.itemCount + '</div></div>'
      );
      var rows = data.recent || [];
      if (!rows.length) {
        $("#recentTable").html('<tr><td colspan="7" class="text-muted">No bills yet. Create your first quotation or invoice.</td></tr>');
        $("#recentCards").html('<div class="text-muted">No bills yet.</div>');
        return;
      }
      $("#recentTable").html(rows.map(function (r, idx) {
        var type = r.doc_type === "quotation" ? "Quotation" : "Tax Invoice";
        return '<tr><td>' + (idx + 1) + '</td><td>' + (r.bill_number || 0) + '</td><td>' + type + '</td><td>' + window.UI.escapeHtml(r.client_name || "") +
          '</td><td>' + H.formatDate(r.invoice_date) + '</td><td class="text-end">₹' + H.formatMoney(r.total) +
          '</td><td><a class="btn btn-sm btn-outline-brand" href="invoice-print.html?id=' + encodeURIComponent(r.id) + '">Report</a></td></tr>';
      }).join(""));
      $("#recentCards").html(rows.map(function (r, idx) {
        var type = r.doc_type === "quotation" ? "Quotation" : "Tax Invoice";
        return '<div class="data-card"><div class="title">#' + (idx + 1) + ' · ' + window.UI.escapeHtml(r.client_name || "") +
          '</div><div class="meta">' + type + ' · Bill #' + (r.bill_number || 0) + ' · ' + H.formatDate(r.invoice_date) +
          '</div><div class="meta">₹' + H.formatMoney(r.total) + '</div><div class="actions">' +
          '<a class="btn btn-sm btn-outline-brand" href="invoice-print.html?id=' + encodeURIComponent(r.id) + '">Report</a>' +
          '<a class="btn btn-sm btn-brand" href="create-invoice.html?id=' + encodeURIComponent(r.id) + '">Edit</a></div></div>';
      }).join(""));
    });
  </script>
</body>
</html>
