<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div id="modeBadge" class="mode-badge">Demo mode</div>
      <h1>Invoice App</h1>
      <p class="text-muted mb-3">Quotations &amp; GST tax invoices — works on phone and desktop.</p>

      <ul class="nav nav-pills mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabLogin" type="button">Sign In</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabSignup" type="button">Sign Up</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabLogin">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label" for="loginEmail">Email</label>
              <input class="form-control" type="email" id="loginEmail" required autocomplete="username" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="loginPassword">Password</label>
              <input class="form-control" type="password" id="loginPassword" required autocomplete="current-password" />
            </div>
            <button class="btn btn-brand w-100" type="submit">Sign In</button>
          </form>
          <div id="demoHint" class="alert alert-light border mt-3 mb-0 small">
            <strong>Demo login:</strong><br />
            Email: <code>demo@invoice.local</code><br />
            Password: <code>demo1234</code>
          </div>
        </div>
        <div class="tab-pane fade" id="tabSignup">
          <form id="signupForm">
            <div class="mb-3">
              <label class="form-label" for="signupName">Business / Biller name</label>
              <input class="form-control" type="text" id="signupName" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="signupEmail">Email</label>
              <input class="form-control" type="email" id="signupEmail" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="signupPassword">Password</label>
              <input class="form-control" type="password" id="signupPassword" required minlength="6" />
            </div>
            <button class="btn btn-brand w-100" type="submit">Create account</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    $(async function () {
      window.initDB();
      await window.Auth.redirectIfAuthed();
      if (window.APP_CONFIG.useSupabase()) {
        $("#modeBadge").text("Cloud (Supabase)").addClass("cloud");
        $("#demoHint").hide();
      } else {
        $("#loginEmail").val(window.APP_CONFIG.DEMO_EMAIL);
        $("#loginPassword").val(window.APP_CONFIG.DEMO_PASSWORD);
      }

      $("#loginForm").on("submit", async function (e) {
        e.preventDefault();
        try {
          await window.DB.signIn($("#loginEmail").val().trim(), $("#loginPassword").val());
          window.location.href = "dashboard.html";
        } catch (err) {
          window.UI.toast(err.message || "Login failed", "error");
        }
      });

      $("#signupForm").on("submit", async function (e) {
        e.preventDefault();
        try {
          await window.DB.signUp(
            $("#signupEmail").val().trim(),
            $("#signupPassword").val(),
            $("#signupName").val().trim()
          );
          window.UI.toast("Account created", "success");
          window.location.href = "dashboard.html";
        } catch (err) {
          window.UI.toast(err.message || "Sign up failed", "error");
        }
      });
    });
  </script>
</body>
</html>
