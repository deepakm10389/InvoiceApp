<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · Invoice App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="pageRoot">
    <h1 class="page-title">Profile &amp; letterhead</h1>
    <p class="page-sub">Biller details shown on quotations and tax invoices, plus bank details.</p>

    <form id="profileForm" class="card-panel">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Biller name *</label>
          <input class="form-control" id="biller_name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Proprietor name</label>
          <input class="form-control" id="proprietor_name" />
        </div>
        <div class="col-12">
          <label class="form-label">Tagline</label>
          <input class="form-control" id="tagline" placeholder="FURNITURE POLISH, PAINTING, …" />
        </div>
        <div class="col-12">
          <label class="form-label">Address</label>
          <textarea class="form-control" id="address" rows="4"></textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">GSTIN</label>
          <input class="form-control" id="gst_no" />
        </div>
        <div class="col-md-4">
          <label class="form-label">PAN</label>
          <input class="form-control" id="pan_no" />
        </div>
        <div class="col-md-4">
          <label class="form-label">State code</label>
          <input class="form-control" id="state_code" placeholder="27" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Mobile</label>
          <input class="form-control" type="tel" id="phone" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" id="email" />
        </div>
      </div>

      <hr class="my-4" />
      <h2 class="h5">Bank details</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Bank name</label>
          <input class="form-control" id="bank_name" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Account no</label>
          <input class="form-control" id="account_no" />
        </div>
        <div class="col-md-6">
          <label class="form-label">IFSC code</label>
          <input class="form-control" id="ifsc_code" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Branch</label>
          <input class="form-control" id="branch" />
        </div>
      </div>
      <button type="submit" class="btn btn-brand mt-3">Save profile</button>
    </form>

    <form id="passwordForm" class="card-panel">
      <h2 class="h5">Change password</h2>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Old password</label>
          <input class="form-control" type="password" id="old_password" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">New password</label>
          <input class="form-control" type="password" id="new_password" required minlength="6" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Confirm password</label>
          <input class="form-control" type="password" id="confirm_password" required minlength="6" />
        </div>
      </div>
      <button type="submit" class="btn btn-outline-brand mt-3">Update password</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    $(async function () {
      var session = await window.UI.bootPage("profile.html");
      if (!session) return;
      var p = await window.DB.getProfile();
      if (p) {
        [
          "biller_name",
          "proprietor_name",
          "tagline",
          "address",
          "gst_no",
          "pan_no",
          "state_code",
          "phone",
          "email",
          "bank_name",
          "account_no",
          "ifsc_code",
          "branch"
        ].forEach(function (k) {
          $("#" + k).val(p[k] || "");
        });
      }

      $("#profileForm").on("submit", async function (e) {
        e.preventDefault();
        try {
          await window.DB.saveProfile({
            biller_name: $("#biller_name").val().trim(),
            proprietor_name: $("#proprietor_name").val().trim(),
            tagline: $("#tagline").val().trim(),
            address: $("#address").val().trim(),
            gst_no: $("#gst_no").val().trim(),
            pan_no: $("#pan_no").val().trim(),
            state_code: $("#state_code").val().trim(),
            phone: $("#phone").val().trim(),
            email: $("#email").val().trim(),
            bank_name: $("#bank_name").val().trim(),
            account_no: $("#account_no").val().trim(),
            ifsc_code: $("#ifsc_code").val().trim(),
            branch: $("#branch").val().trim()
          });
          window.UI.toast("Profile saved", "success");
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });

      $("#passwordForm").on("submit", async function (e) {
        e.preventDefault();
        if ($("#new_password").val() !== $("#confirm_password").val()) {
          window.UI.toast("New passwords do not match", "error");
          return;
        }
        try {
          await window.DB.changePassword($("#old_password").val(), $("#new_password").val());
          $("#passwordForm")[0].reset();
          window.UI.toast("Password updated", "success");
        } catch (err) {
          window.UI.toast(err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
